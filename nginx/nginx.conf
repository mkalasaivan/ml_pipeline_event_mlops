# Round-robin load balancer in front of the API containers.
# Docker's DNS returns every replica of the `api` service; `resolver` + a variable
# makes nginx re-resolve, so scaling up/down is picked up without restarting nginx.
events {}
http {
    client_max_body_size 1g;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream api_pool {
        zone api_pool 64k;
        server api:8000 resolve;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://api_pool;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}

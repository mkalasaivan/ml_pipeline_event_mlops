# Run:   docker compose up -d --build
# Scale: docker compose up -d --scale api=3     (1, 2, 3 ... containers behind nginx)
services:
  api:
    build: .
    image: football-event-api
    environment:
      - MODELS_DIR=/app/models
      - DATA_DIR=/app/data
    volumes:
      - models:/app/models      # shared so a retrained model reaches every container
      - data:/app/data          # uploaded images + SQLite database
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  models:
  data:
